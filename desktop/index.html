<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trail</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("trail.theme") || localStorage.getItem("rings.theme") || "system";
          var light =
            pref === "light" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: oklch(0% 0 0);
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: oklch(95.5% 0 0);
      }

      @font-face {
        font-family: "Gilroy";
        src: url("/src/fonts/Gilroy-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: inherit;
        transition:
          opacity 320ms cubic-bezier(0.2, 0, 0, 1),
          transform 320ms cubic-bezier(0.2, 0, 0, 1);
      }
      #splash.splash-out {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }

      .splash-mark {
        animation: splash-in 520ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      .splash-name {
        font-family: "Gilroy", "Segoe UI", system-ui, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        color: oklch(65% 0 0);
        animation: splash-in 520ms cubic-bezier(0.2, 0, 0, 1) 90ms both;
      }
      .splash-bar {
        position: relative;
        width: 132px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: oklch(100% 0 0 / 0.12);
        animation: splash-in 520ms cubic-bezier(0.2, 0, 0, 1) 150ms both;
      }
      html[data-theme="light"] .splash-name {
        color: oklch(45% 0 0);
      }
      html[data-theme="light"] .splash-bar {
        background: oklch(0% 0 0 / 0.12);
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto;
        width: 42%;
        height: 100%;
        border-radius: 2px;
        background: oklch(96.84% 0.2067 109.71);
        animation: splash-sweep 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(348%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-name,
        .splash-bar {
          animation-duration: 1ms;
          animation-delay: 0ms;
        }
        .splash-bar::after {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="splash">
      <svg class="splash-mark" width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="32" fill="#FFFF1E" />
        <g fill="#000000">
          <rect x="15.5" y="35" width="12" height="12" rx="3.75" />
          <rect x="26" y="26" width="12" height="12" rx="3.75" />
          <rect x="36.5" y="17" width="12" height="12" rx="3.75" />
        </g>
      </svg>
      <div class="splash-name">Trail</div>
      <div class="splash-bar"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
